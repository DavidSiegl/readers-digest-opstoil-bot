name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release of that commit, with the
# sdist, the wheel and readers-digest.pyz attached and, as notes, the subjects of the commits since
# the previous v* tag (GitHub's generated notes list merged pull requests,
# and this repo has none).
#
# To release, set the version with `uv version`, which writes it to both
# pyproject.toml and uv.lock (an edit of pyproject.toml alone leaves the lock
# stale, and `uv sync --locked` below refuses it), commit both, and push the
# commit and its tag:
#
#   uv version 0.2.0
#   git commit -m "Release 0.2.0" pyproject.toml uv.lock
#   git tag -a v0.2.0 -m "readers-digest 0.2.0" && git push origin main v0.2.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Runs the project's code and its dependencies, so it gets no write token:
  # a step here can change the PATH and environment of every later step of
  # its own job, and the publish job is a separate one on a fresh runner.
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, as in ci.yml.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      # The wheel takes its version from pyproject.toml, not from the tag;
      # a tag that names another version would publish a mislabelled wheel.
      - name: Check the tag names pyproject.toml's version
        run: |
          version=$(uv version --short)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml says $version"
            exit 1
          fi
      - run: uv build
      # One file that runs on any Python 3.12 or later: the wheel's contents,
      # its metadata included so that --version knows the version, zipped
      # with a __main__.py that runs the CLI.
      - name: Build readers-digest.pyz
        run: |
          stage="$RUNNER_TEMP/pyz"
          uv run python -m zipfile -e dist/*.whl "$stage"
          uv run python -m zipapp "$stage" -c -p "/usr/bin/env python3" -m readers_digest.cli:main \
            -o dist/readers-digest.pyz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Holds the write token and runs nothing of the project's: checkout, the
  # artifact download, git and gh.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history, to find the previous v* tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Write the release notes
        run: |
          notes="$RUNNER_TEMP/notes.md"
          if prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null); then
            git log --no-merges --format='- %s' "$prev..$GITHUB_REF_NAME" > "$notes"
            [ -s "$notes" ] || echo "No changes since $prev." > "$notes"
          else
            echo "First release." > "$notes"
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
