name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release of that commit, with the
# sdist and wheel attached and notes listing the commits since the previous
# tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, as in ci.yml. Full history, for the previous tag.
      # The job's write token stays out of .git/config, where the tests and
      # the build backend (third-party code) could read it; only the publish
      # step gets it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      # The wheel takes its version from pyproject.toml, not from the tag;
      # a tag that names another version would publish a mislabelled wheel.
      - name: Check the tag names pyproject.toml's version
        run: |
          version=$(uv version --short)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml says $version"
            exit 1
          fi
      - run: uv build
      # GitHub's generated notes list merged pull requests, and this repo has
      # none, so the notes are the commit subjects.
      - name: Write the release notes
        run: |
          if prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null); then
            git log --no-merges --format='- %s' "$prev..$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          else
            echo "First release." > "$RUNNER_TEMP/notes.md"
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
