<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- A little bot in reading glasses, reading its digest: it reads and
       never writes. readers-digest-attention.svg is this with a dot;
       change both files together. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#3d3846"/>
  <rect x="4" y="4" width="120" height="60" rx="28" fill="#ffffff" opacity="0.08"/>

  <!-- antenna -->
  <line x1="64" y1="31" x2="64" y2="14" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="12" r="5.5" fill="#f6c343"/>

  <!-- ears -->
  <rect x="14" y="48" width="12" height="22" rx="6" fill="#deddda"/>
  <rect x="102" y="48" width="12" height="22" rx="6" fill="#deddda"/>

  <!-- head, visor and eyes -->
  <rect x="22" y="30" width="84" height="58" rx="24" fill="#ffffff"/>
  <rect x="31" y="40" width="66" height="34" rx="16" fill="#241f31"/>
  <circle cx="50" cy="56" r="8.5" fill="#7fe0ff"/>
  <circle cx="78" cy="56" r="8.5" fill="#7fe0ff"/>
  <circle cx="53" cy="52.5" r="3" fill="#ffffff"/>
  <circle cx="81" cy="52.5" r="3" fill="#ffffff"/>

  <!-- reading glasses -->
  <circle cx="50" cy="56" r="12" fill="none" stroke="#f6c343" stroke-width="3.5"/>
  <circle cx="78" cy="56" r="12" fill="none" stroke="#f6c343" stroke-width="3.5"/>
  <path d="M62 54 Q64 51 66 54" fill="none" stroke="#f6c343" stroke-width="3" stroke-linecap="round"/>
  <path d="M38 54 L32 51 M90 54 L96 51" stroke="#f6c343" stroke-width="3" stroke-linecap="round"/>

  <path d="M58 70 Q64 74 70 70" fill="none" stroke="#7fe0ff" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="34" cy="78" rx="6" ry="3.5" fill="#ff9aa8" opacity="0.8"/>
  <ellipse cx="94" cy="78" rx="6" ry="3.5" fill="#ff9aa8" opacity="0.8"/>

  <!-- the digest it is reading -->
  <path d="M26 84 H102 a5 5 0 0 1 5 5 V110 a6 6 0 0 1 -6 6 H27 a6 6 0 0 1 -6 -6 V89 a5 5 0 0 1 5 -5 Z"
        fill="#f7f3ec" stroke="#241f31" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="64" y1="86" x2="64" y2="114" stroke="#241f31" stroke-width="2.5"/>
  <rect x="30" y="90" width="27" height="6" rx="2" fill="#1c71d8"/>
  <rect x="30" y="100" width="27" height="3.5" rx="1.75" fill="#b9a7ab"/>
  <rect x="30" y="107" width="19" height="3.5" rx="1.75" fill="#b9a7ab"/>
  <rect x="71" y="90" width="27" height="3.5" rx="1.75" fill="#b9a7ab"/>
  <rect x="71" y="97" width="27" height="3.5" rx="1.75" fill="#b9a7ab"/>
  <rect x="71" y="104" width="18" height="3.5" rx="1.75" fill="#b9a7ab"/>

  <!-- hands -->
  <circle cx="22" cy="100" r="7" fill="#ffffff" stroke="#241f31" stroke-width="3"/>
  <circle cx="106" cy="100" r="7" fill="#ffffff" stroke="#241f31" stroke-width="3"/>
</svg>
